openapi: 3.0.0
info:
  title: MediTrac API
  version: 1.0.0
  description: >
    API for MediTrac — connects patients with real-time pharmacy medication
    stock, pricing, and location data.

servers:
  - url: http://localhost:5000/api
    description: Local development server

paths:

  /medications:
    get:
      summary: Return all medications across all pharmacies.
      responses:
        '200':
          description: A list of medication records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Medication'

    post:
      summary: Create a new medication record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationInput'
      responses:
        '201':
          description: Medication created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
        '400':
          description: Validation failed — missing or wrong-type fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /medications/by-pharmacy:
    get:
      summary: Return medications belonging to a single pharmacy, by pharmacy name.
      parameters:
        - name: name
          in: query
          required: true
          description: The pharmacy's name to filter medications by.
          schema:
            type: string
          example: "Halisi Pharmaceuticals"
      responses:
        '200':
          description: A list of medications for the given pharmacy.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Medication'
        '400':
          description: Missing required "name" query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No pharmacy exists with the given name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /medications/{id}:
    put:
      summary: Replace an existing medication's details.
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the medication to update.
          schema:
            type: string
            format: uuid
          example: "1797cd3d-cd55-41bc-b791-ffbf1c0187b8"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationInput'
      responses:
        '200':
          description: Medication updated successfully; the full updated record is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
        '400':
          description: Validation failed — missing or wrong-type fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: No medication exists with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a medication record.
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the medication to delete.
          schema:
            type: string
            format: uuid
          example: "d4e5f6a7-1111-2222-3333-444455556666"
      responses:
        '204':
          description: Medication deleted successfully. No content returned.
        '404':
          description: No medication exists with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /medications/{id}/stock:
    patch:
      summary: Update just the quantity (stock level) for one medication.
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the medication whose stock is being updated.
          schema:
            type: string
            format: uuid
          example: "1797cd3d-cd55-41bc-b791-ffbf1c0187b8"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: integer
                  example: 85
      responses:
        '200':
          description: Stock updated successfully; the updated medication is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
        '400':
          description: Missing or invalid quantity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No medication exists with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Medication:
      type: object
      required:
        - id
        - name
        - quantity
        - price
        - pharmacy_id
      properties:
        id:
          type: string
          format: uuid
          example: "d4e5f6a7-1111-2222-3333-444455556666"
        name:
          type: string
          example: "Paracetamol 500mg"
        form:
          type: string
          example: "Tablet"
        category:
          type: string
          example: "Analgesic"
        quantity:
          type: integer
          example: 120
        unit:
          type: string
          example: "box"
        price:
          type: number
          format: float
          example: 50.00
        branch:
          type: string
          example: "Kilimani Branch"
        pharmacy_id:
          type: string
          format: uuid
          example: "b3f1c2a0-1234-4a5b-9c3d-abcdef123456"

    MedicationInput:
      type: object
      required:
        - name
        - quantity
        - price
        - pharmacy_id
      properties:
        name:
          type: string
          example: "Paracetamol 500mg"
        form:
          type: string
          example: "Tablet"
        category:
          type: string
          example: "Analgesic"
        quantity:
          type: integer
          example: 120
        unit:
          type: string
          example: "box"
        price:
          type: number
          format: float
          example: 50.00
        branch:
          type: string
          example: "Kilimani Branch"
        pharmacy_id:
          type: string
          format: uuid
          example: "b3f1c2a0-1234-4a5b-9c3d-abcdef123456"

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Medication not found"

    ValidationError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: "Validation failed"
        errors:
          type: array
          items:
            type: string
          example: ["name is required", "quantity must be an integer"]