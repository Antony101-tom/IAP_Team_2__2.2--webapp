openapi: 3.0.0
info:
  title: MediTrac API
  version: 1.0.0
  description: >
    API for MediTrac — connects patients with real-time pharmacy medication
    stock, pricing, and location data.

servers:
  - url: http://localhost:5000/api
    description: Local development server
  # Add your hosted URL here once deployed, e.g.:
  # - url: https://your-app.onrender.com/api
  #   description: Live server

security: []

paths:

  /medications:
    get:
      summary: Return all medications across all pharmacies.
      responses:
        '200':
          description: A list of medication records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Medication'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      summary: Create a new medication record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationInput'
      responses:
        '201':
          description: Medication created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
        '400':
          description: Validation failed — missing or wrong-type fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: The pharmacy_id does not match any existing pharmacy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Pharmacy not found"
        '500':
          $ref: '#/components/responses/ServerError'

  /medications/by-pharmacy:
    get:
      summary: Return medications belonging to a single pharmacy, by pharmacy name.
      description: The name match is exact and case-sensitive.
      parameters:
        - name: name
          in: query
          required: true
          description: The pharmacy's name to filter medications by.
          schema:
            type: string
          example: "Jadeezy Pharmacy"
      responses:
        '200':
          description: A list of medications for the given pharmacy.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Medication'
        '400':
          description: Missing required "name" query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No pharmacy exists with the given name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Pharmacy not found"
        '500':
          $ref: '#/components/responses/ServerError'

  /medications/{id}:
    put:
      summary: Replace an existing medication's details.
      description: >
        Two different 404 responses are possible: "Pharmacy not found" if the
        pharmacy_id in the body does not exist, or "Medication not found" if
        the id in the URL does not exist.
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the medication to update.
          schema:
            type: string
            format: uuid
          example: "9db9929c-3999-484b-8cf9-936ea3d4e349"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicationInput'
      responses:
        '200':
          description: Medication updated successfully; the full updated record is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
        '400':
          description: Validation failed — missing or wrong-type fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Pharmacy not found, or no medication exists with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                pharmacyMissing:
                  summary: pharmacy_id does not exist
                  value:
                    error: "Pharmacy not found"
                medicationMissing:
                  summary: id in the URL does not exist
                  value:
                    error: "Medication not found"
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      summary: Delete a medication record.
      description: >
        Deleting is permanent. To try it safely, create a throwaway record with
        POST /medications, copy the returned id, then delete that one.
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the medication to delete.
          schema:
            type: string
            format: uuid
          example: "4984de2e-d9dd-45d9-99ac-4f292b3365c4"
      responses:
        '204':
          description: Medication deleted successfully. No content returned.
        '404':
          description: No medication exists with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /medications/{id}/stock:
    patch:
      summary: Update just the quantity (stock level) for one medication.
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the medication whose stock is being updated.
          schema:
            type: string
            format: uuid
          example: "9db9929c-3999-484b-8cf9-936ea3d4e349"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: integer
                  example: 85
      responses:
        '200':
          description: Stock updated successfully; the updated medication is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medication'
        '400':
          description: Missing or invalid quantity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No medication exists with the given id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  responses:
    ServerError:
      description: Unexpected server or database failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Failed to fetch medications"

  schemas:
    Medication:
      type: object
      required:
        - id
        - name
        - quantity
        - price
        - pharmacy_id
      properties:
        id:
          type: string
          format: uuid
          example: "9db9929c-3999-484b-8cf9-936ea3d4e349"
        pharmacy_id:
          type: string
          format: uuid
          description: The id of the pharmacy (a row in the profiles table) that stocks this medication.
          example: "719b4e69-ce9c-4dab-9eae-722dc0f371b5"
        name:
          type: string
          example: "Paracetamol 500mg"
        form:
          type: string
          example: "Tablet"
        category:
          type: string
          example: "Analgesic"
        quantity:
          type: integer
          example: 120
        unit:
          type: string
          example: "box"
        price:
          type: number
          example: 50
        branch:
          type: string
          example: "Kilimani Branch"
        created_at:
          type: string
          format: date-time
          example: "2026-10-12T11:29:11.492955+00:00"

    MedicationInput:
      type: object
      required:
        - name
        - quantity
        - price
        - pharmacy_id
      properties:
        name:
          type: string
          example: "Paracetamol 500mg"
        form:
          type: string
          example: "Tablet"
        category:
          type: string
          example: "Analgesic"
        quantity:
          type: integer
          example: 120
        unit:
          type: string
          example: "box"
        price:
          type: number
          example: 50
        branch:
          type: string
          example: "Kilimani Branch"
        pharmacy_id:
          type: string
          format: uuid
          description: Must be the id of an existing pharmacy, otherwise the API returns 404 "Pharmacy not found".
          example: "719b4e69-ce9c-4dab-9eae-722dc0f371b5"

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "Medication not found"

    ValidationError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: "Validation failed"
        errors:
          type: array
          items:
            type: string
          example: ["name is required", "quantity must be an integer"]